name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - run: python -m pip install ".[dev,demo]"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --dir vscode-extension check
      - run: pnpm --dir vscode-extension test
      - run: python scripts/install_vscode.py --build-only
      - run: pytest -q
      - name: Smoke-test Unix installer
        if: runner.os != 'Windows'
        run: TRACEPAD_VENV=.tracepad-smoke ./scripts/install.sh --minimal
      - name: Smoke-test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\install.ps1 -Venv .tracepad-smoke -Minimal
      - run: python scripts/verify_install.py --venv .tracepad-smoke
      - run: python scripts/demo.py --venv .tracepad-smoke --dry-run
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: tracepad-wheel-${{ matrix.os }}
          path: dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: tracepad-vscode-vsix-${{ matrix.os }}
          path: vscode-extension/dist/*.vsix
