[build-system]
requires = ["hatchling>=1.21.0", "hatch-jupyter-builder>=0.9.0"]
build-backend = "hatchling.build"

[project]
name = "tracepad"
version = "0.3.10"
description = "Inspectable, AI-assisted notebook workflows for JupyterLab, VS Code, and Marimo"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tracepad contributors" }]
classifiers = [
  "Framework :: Jupyter",
  "Framework :: Jupyter :: JupyterLab",
  "Framework :: Jupyter :: JupyterLab :: 4",
  "Framework :: Jupyter :: JupyterLab :: Extensions",
  "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt"
]
dependencies = [
  "jupyterlab>=4.4,<5",
  "jupyter_server>=2.0",
  "jupyter_client>=8.0",
  "PyYAML>=6.0",
  "traitlets>=5.9"
]

[project.optional-dependencies]
demo = [
  "matplotlib>=3.8",
  "pandas>=2.1",
  "statsmodels>=0.14"
]
marimo = [
  "marimo>=0.23.1,<0.24; python_version >= '3.10'"
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-asyncio>=0.23"
]

[project.entry-points."jupyter_server.extension"]
tracepad = "tracepad.server"

[tool.hatch.build.targets.wheel.shared-data]
"tracepad/labextension" = "share/jupyter/labextensions/@tracepad/jupyterlab"
"jupyter-config/jupyter_server_config.d/tracepad.json" = "etc/jupyter/jupyter_server_config.d/tracepad.json"
"tracepad_demo.ipynb" = "share/tracepad/tracepad_demo.ipynb"
"demo/tracepad_demo_clean.ipynb" = "share/tracepad/tracepad_demo_clean.ipynb"
"demo/tracepad_marimo_demo.py" = "share/tracepad/tracepad_marimo_demo.py"
"demo/data/retail_orders.csv" = "share/tracepad/data/retail_orders.csv"
"style/marimo.css" = "share/tracepad/style/marimo.css"

[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = ["tracepad/labextension/static/style.js"]
skip-if-exists = ["tracepad/labextension/static/style.js"]
build-kwargs = { build_cmd = "build", npm = ["pnpm"] }
editable-build-kwargs = { build_cmd = "build", npm = ["pnpm"] }

[tool.marimo.display]
cell_output = "below"
custom_css = ["style/marimo.css"]
dataframes = "rich"
default_width = "full"
reference_highlighting = true

[tool.marimo.ai]
rules = """
Generate one concise executable cell for the active request. Treat prior cells as context, not as requests to repeat. Reuse variables referenced with @ by their existing Python names. Assign the primary reusable result to a descriptive snake_case variable. Preserve fitted model objects instead of replacing them with summaries or predictions. When tracepad.marimo is imported as tracepad_marimo, end analytical cells with tracepad_marimo.inspect(result_name, name="result_name", parents=["input_name"]) so tables, plots, and models receive the Tracepad inspection surface. Omit parents when the result has no named input. Never include credentials in generated code.
"""
